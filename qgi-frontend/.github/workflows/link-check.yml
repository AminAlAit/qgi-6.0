name: Link check

# Crawls every reachable page on the production build and asserts every
# internal link + a curated set of external links returns 2xx. Catches
# the regressions QA caught on 2026-04-24:
#   - /og-default.png 404 sitewide
#   - blog posts referencing missing /og.png art
#   - /reports orphaned from FSI report card
#   - any future mistyped internal href
#
# Runs against `npm run start` on the runner so PRs from forks (no Vercel
# preview URL) still get the check.
#
# Related tickets: #441 (this), #441 Part A is .github/workflows/lighthouse.yml.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - ".claude/**"
      - "qgi-docs/**"
      - "**/*.png"
      - "**/*.jpg"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - ".claude/**"
      - "qgi-docs/**"
      - "**/*.png"
      - "**/*.jpg"
      - "LICENSE"

# #454: cancel-in-progress to keep concurrent runs from doubling cost.
concurrency:
  group: linkcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    name: linkinator
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          NEXT_TELEMETRY_DISABLED: "1"
          SKIP_AUTH: "true"
          SKIP_AUTH_GROUPS: "pro"

      - name: Start app
        run: npm run start -- -p 3000 &
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          SKIP_AUTH: "true"
          SKIP_AUTH_GROUPS: "pro"
          PORT: "3000"

      - name: Wait for server
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/ -o /dev/null; then
              echo "Server ready (waited ${i}s)"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not respond within 60s"
          exit 1

      - name: Run linkinator
        run: npx linkinator http://localhost:3000/ --config .linkinatorrc.json
