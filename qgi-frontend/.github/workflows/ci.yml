name: CI

# #454 cost cap: skip CI for changes that can't break the build (docs,
# .gitignore, agent prompts). Saves ~30% of monthly Actions minutes on a
# private Free repo (2,000 min/mo ceiling).
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - ".claude/**"
      - "qgi-docs/**"
      - "**/*.png"
      - "**/*.jpg"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - ".claude/**"
      - "qgi-docs/**"
      - "**/*.png"
      - "**/*.jpg"
      - "LICENSE"

# #454: cancel an in-progress CI run on the same branch when a new push
# arrives. Stops a rapid-fire `git push` from stacking 4 CI runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build
