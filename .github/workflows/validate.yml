name: Validate

on:
  push:
    branches: [main]
    paths: ['events/**', 'registries/**']
  pull_request:
    branches: [main]
    paths: ['events/**', 'registries/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate event JSON files
        run: python scripts/validate_events.py
      - name: Validate candidate registry
        run: python scripts/validate_registry.py
