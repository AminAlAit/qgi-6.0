name: ECR push — scdi-finder
on:
  push:
    branches: [main]
    paths:
      - 'batch/scdi-finder/**'
jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::111111111111:role/github-actions-qgi-ecr-push
          aws-region: eu-central-1
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        run: |
          IMAGE_TAG=${GITHUB_SHA::8}
          ECR_REGISTRY=111111111111.dkr.ecr.eu-central-1.amazonaws.com
          IMAGE=$ECR_REGISTRY/qgi-pipeline-b-scdi-finder:$IMAGE_TAG
          docker buildx build --platform linux/arm64 -t $IMAGE --push batch/scdi-finder/
          docker buildx build --platform linux/arm64 -t $ECR_REGISTRY/qgi-pipeline-b-scdi-finder:latest --push batch/scdi-finder/
