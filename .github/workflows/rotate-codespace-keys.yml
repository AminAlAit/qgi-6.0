# Rotates the ci-terraform-deployer IAM access key monthly
# and updates the GitHub Codespace secret so Claude's autonomous AWS access
# remains valid without human intervention.
#
# Prerequisites (one-time setup by Amin):
#   1. Store a GitHub PAT with `codespace:secrets` scope as a repo Actions secret
#      named GH_PAT_CODESPACE_SECRETS in AminAlAit/qgi-aws-tf.
#   2. Ensure the github-actions-codespace-key-rotator IAM role exists (Terraform).
#
# The workflow NEVER stores the new key in logs. It writes directly to
# GitHub Codespace secrets via the encrypted GitHub API endpoint.

name: Rotate Codespace AWS Keys

on:
  schedule:
    # 1st of every month at 03:00 UTC
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — report current key age without rotating"
        required: false
        default: "false"
        type: boolean

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  rotate:
    name: Rotate IAM key for ci-terraform-deployer
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::111111111111:role/github-actions-codespace-key-rotator
          aws-region: eu-central-1

      - name: List current access keys
        id: list_keys
        run: |
          KEYS=$(aws iam list-access-keys \
            --user-name ci-terraform-deployer \
            --query 'AccessKeyMetadata[].{Id:AccessKeyId,Created:CreateDate}' \
            --output json)
          echo "Current keys: $KEYS"
          KEY_COUNT=$(echo "$KEYS" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          echo "key_count=$KEY_COUNT" >> "$GITHUB_OUTPUT"
          OLD_KEY_ID=$(echo "$KEYS" | python3 -c "
          import sys, json
          keys = sorted(json.load(sys.stdin), key=lambda x: x['Created'])
          print(keys[0]['Id'])
          ")
          echo "old_key_id=$OLD_KEY_ID" >> "$GITHUB_OUTPUT"

      - name: Dry run — report key age
        if: inputs.dry_run == 'true'
        run: |
          aws iam list-access-keys \
            --user-name ci-terraform-deployer \
            --query 'AccessKeyMetadata[].{Id:AccessKeyId,Status:Status,Created:CreateDate}' \
            --output table
          echo "Dry run complete. No keys were rotated."

      - name: Create new access key
        if: inputs.dry_run != 'true'
        id: create_key
        run: |
          NEW_KEY=$(aws iam create-access-key \
            --user-name ci-terraform-deployer \
            --query 'AccessKey.{Id:AccessKeyId,Secret:SecretAccessKey}' \
            --output json)
          # Write to masked env — never echoed to logs
          NEW_KEY_ID=$(echo "$NEW_KEY" | python3 -c "import sys,json; print(json.load(sys.stdin)['Id'])")
          NEW_KEY_SECRET=$(echo "$NEW_KEY" | python3 -c "import sys,json; print(json.load(sys.stdin)['Secret'])")
          echo "::add-mask::$NEW_KEY_ID"
          echo "::add-mask::$NEW_KEY_SECRET"
          echo "new_key_id=$NEW_KEY_ID" >> "$GITHUB_OUTPUT"
          echo "new_key_secret=$NEW_KEY_SECRET" >> "$GITHUB_OUTPUT"

      - name: Update GitHub Codespace secrets
        if: inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_CODESPACE_SECRETS }}
          NEW_KEY_ID: ${{ steps.create_key.outputs.new_key_id }}
          NEW_KEY_SECRET: ${{ steps.create_key.outputs.new_key_secret }}
        run: |
          gh secret set AWS_ACCESS_KEY_ID \
            --repo AminAlAit/qgi-aws-tf \
            --app codespaces \
            --body "$NEW_KEY_ID"

          gh secret set AWS_SECRET_ACCESS_KEY \
            --repo AminAlAit/qgi-aws-tf \
            --app codespaces \
            --body "$NEW_KEY_SECRET"

          echo "Codespace secrets updated."

      - name: Delete old access key
        if: inputs.dry_run != 'true'
        run: |
          OLD_KEY_ID="${{ steps.list_keys.outputs.old_key_id }}"
          # Only delete the old key if we now have 2 keys (old + new)
          KEY_COUNT="${{ steps.list_keys.outputs.key_count }}"
          aws iam delete-access-key \
            --user-name ci-terraform-deployer \
            --access-key-id "$OLD_KEY_ID"
          echo "Deleted old key: $OLD_KEY_ID"

      - name: Verify final state
        if: inputs.dry_run != 'true'
        run: |
          aws iam list-access-keys \
            --user-name ci-terraform-deployer \
            --query 'AccessKeyMetadata[].{Id:AccessKeyId,Status:Status,Created:CreateDate}' \
            --output table
