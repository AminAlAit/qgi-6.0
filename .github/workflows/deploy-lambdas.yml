name: Deploy Lambdas

on:
  push:
    branches: [main]
    paths:
      - 'lambdas/**'
  # Allow deploying all functions to a specific environment on demand
  workflow_dispatch:
    inputs:
      deploy_all:
        description: 'Deploy ALL Lambda functions (not just changed)'
        required: false
        default: false
        type: boolean
      environment:
        description: 'Target environment'
        required: false
        default: 'staging'
        type: choice
        options: [staging, prod]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Staging: assume role in qgi-staging account via its own OIDC role
      - name: Configure AWS credentials (staging)
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::222222222222:role/github-actions-qgi-lambda-deploy
          aws-region: eu-central-1

      # Prod: assume role in qgi-prod account (444444444444)
      - name: Configure AWS credentials (prod)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::444444444444:role/github-actions-qgi-lambda-deploy
          aws-region: eu-central-1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Deploy Lambdas
        run: |
          if [ "${{ inputs.deploy_all }}" = "true" ]; then
            CHANGED=$(ls lambdas/)
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD \
              | grep '^lambdas/' | cut -d/ -f2 | sort -u)
          fi

          for NAME in $CHANGED; do
            LAMBDA_DIR="lambdas/$NAME"
            [ -f "$LAMBDA_DIR/lambda_function.py" ] || continue
            # pipeline-c-poc is being retired (issue #61) — skip
            [ "$NAME" = "pipeline-c-poc" ] && continue

            echo "Deploying qgi-$NAME..."
            WORK=$(mktemp -d)
            cp "$LAMBDA_DIR"/*.py "$WORK"/
            [ -f "$LAMBDA_DIR/indicators.yaml" ] && cp "$LAMBDA_DIR/indicators.yaml" "$WORK/" || true
            if [ -f "$LAMBDA_DIR/requirements.txt" ] && [ -s "$LAMBDA_DIR/requirements.txt" ]; then
              pip install -q -r "$LAMBDA_DIR/requirements.txt" \
                --platform manylinux2014_aarch64 \
                --only-binary=:all: \
                --python-version 3.13 \
                -t "$WORK/"
            fi
            ZIP="$WORK/function.zip"
            (cd "$WORK" && zip -qr "$ZIP" . --exclude "function.zip")

            case "$NAME" in
              pipeline-b-checker) AWS_NAME="qgi-pipeline-ops-batch-checker" ;;
              *) AWS_NAME="qgi-$NAME" ;;
            esac

            aws lambda update-function-code \
              --function-name "$AWS_NAME" \
              --zip-file "fileb://$ZIP" \
              --architectures arm64 \
              --query 'FunctionName' --output text

            rm -rf "$WORK"
          done
