name: Deploy Lambdas

on:
  push:
    branches: [main]
    paths:
      - 'lambdas/**'
  # Allow deploying all functions to a specific environment on demand
  workflow_dispatch:
    inputs:
      deploy_all:
        description: 'Deploy ALL Lambda functions (not just changed)'
        required: false
        default: false
        type: boolean
      environment:
        description: 'Target environment'
        required: false
        default: 'staging'
        type: choice
        options: [staging, qa, prod]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Staging: push to main or workflow_dispatch targeting staging
      - name: Configure AWS credentials (staging)
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::222222222222:role/github-actions-qgi-lambda-deploy
          aws-region: eu-central-1

      # QA: rc-* tags or workflow_dispatch targeting qa
      - name: Configure AWS credentials (qa)
        if: startsWith(github.ref, 'refs/tags/rc-') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'qa')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::333333333333:role/github-actions-qgi-lambda-deploy
          aws-region: eu-central-1

      # Prod: v* tags or workflow_dispatch targeting prod
      - name: Configure AWS credentials (prod)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::444444444444:role/github-actions-qgi-lambda-deploy
          aws-region: eu-central-1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Deploy Lambdas
        run: |
          if [ "${{ inputs.deploy_all }}" = "true" ]; then
            CHANGED=$(ls lambdas/)
          else
            # Use the GitHub push event's before..after SHA range rather than
            # HEAD~1..HEAD so multi-commit pushes don't silently drop commits
            # (2026-04-08: c-dispatcher fix #108 was lost this way). Fall back
            # to HEAD~1..HEAD if before_sha is empty (first push) or all-zeros
            # (workflow_dispatch on a branch tip).
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="HEAD~1"
            fi
            echo "Deploy range: $BEFORE..HEAD"
            CHANGED=$(git diff --name-only "$BEFORE" HEAD \
              | grep '^lambdas/' | cut -d/ -f2 | sort -u)
          fi

          DEPLOYED=0
          SKIPPED=0
          FAILED=0
          for NAME in $CHANGED; do
            LAMBDA_DIR="lambdas/$NAME"
            [ -f "$LAMBDA_DIR/lambda_function.py" ] || { echo "skip $NAME (no lambda_function.py)"; continue; }
            # pipeline-c-poc is being retired (issue #61) — skip
            [ "$NAME" = "pipeline-c-poc" ] && { echo "skip $NAME (retired)"; continue; }

            AWS_NAME="qgi-$NAME"

            # Verify the function exists in AWS before building. Stale repo
            # dirs (e.g. pipeline-a-checker after #FAR-1) otherwise crash the
            # whole workflow on deploy_all=true. Skip with a warning instead.
            if ! aws lambda get-function --function-name "$AWS_NAME" --query 'Configuration.FunctionName' --output text >/dev/null 2>&1; then
              echo "::warning::AWS Lambda '$AWS_NAME' does not exist (stale repo dir?) — skipping"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            echo "Deploying $AWS_NAME..."
            WORK=$(mktemp -d)
            # Bundle the whole Lambda dir, not just *.py — catches sibling
            # modules (#536: country_risks.py was the trigger), JSON configs,
            # SQL templates, etc. Exclude test/cache artifacts and the
            # requirements file (pip-installed separately below).
            rsync -a "$LAMBDA_DIR/" "$WORK/" \
              --exclude '__pycache__/' \
              --exclude '.pytest_cache/' \
              --exclude 'test_*.py' \
              --exclude '*_test.py' \
              --exclude 'tests/' \
              --exclude 'requirements.txt'
            if [ -f "$LAMBDA_DIR/requirements.txt" ] && [ -s "$LAMBDA_DIR/requirements.txt" ]; then
              pip install -q -r "$LAMBDA_DIR/requirements.txt" \
                --platform manylinux2014_aarch64 \
                --only-binary=:all: \
                --python-version 3.13 \
                -t "$WORK/"
            fi
            ZIP="$WORK/function.zip"
            (cd "$WORK" && zip -qr "$ZIP" . --exclude "function.zip")

            if aws lambda update-function-code \
                --function-name "$AWS_NAME" \
                --zip-file "fileb://$ZIP" \
                --architectures arm64 \
                --query 'FunctionName' --output text; then
              DEPLOYED=$((DEPLOYED + 1))
            else
              echo "::error::Failed to deploy $AWS_NAME"
              FAILED=$((FAILED + 1))
            fi

            rm -rf "$WORK"
          done

          echo "Summary: deployed=$DEPLOYED skipped=$SKIPPED failed=$FAILED"
          [ "$FAILED" -eq 0 ] || exit 1

      # #536 Layer 2: post-deploy verification. Fails LOUDLY if any deployed
      # Lambda's LastModified predates this workflow's commit timestamp —
      # catches "runner_id=0" silent failures, partial deploys, IAM drift.
      - name: Verify deploys actually landed
        if: success()
        run: |
          DEPLOY_FLOOR_TS="${{ github.event.head_commit.timestamp }}"
          if [ -z "$DEPLOY_FLOOR_TS" ]; then
            DEPLOY_FLOOR_TS=$(date -u -d '5 minutes ago' '+%Y-%m-%dT%H:%M:%SZ')
            echo "::warning::head_commit.timestamp empty (likely workflow_dispatch); using $DEPLOY_FLOOR_TS as floor"
          fi
          echo "Deploy floor timestamp: $DEPLOY_FLOOR_TS"

          # Re-derive CHANGED the same way as the deploy step
          if [ "${{ inputs.deploy_all }}" = "true" ]; then
            CHANGED=$(ls lambdas/)
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="HEAD~1"
            fi
            CHANGED=$(git diff --name-only "$BEFORE" HEAD \
              | grep '^lambdas/' | cut -d/ -f2 | sort -u)
          fi

          DRIFT=0
          for NAME in $CHANGED; do
            [ -f "lambdas/$NAME/lambda_function.py" ] || continue
            [ "$NAME" = "pipeline-c-poc" ] && continue
            AWS_NAME="qgi-$NAME"
            LAST_MOD=$(aws lambda get-function-configuration \
              --function-name "$AWS_NAME" \
              --query 'LastModified' --output text 2>/dev/null) || continue
            # ISO 8601 string comparison works because both are UTC-Z
            if [[ "$LAST_MOD" < "$DEPLOY_FLOOR_TS" ]]; then
              echo "::error::$AWS_NAME LastModified=$LAST_MOD predates commit $DEPLOY_FLOOR_TS — deploy did NOT land"
              DRIFT=$((DRIFT + 1))
            else
              echo "✓ $AWS_NAME LastModified=$LAST_MOD"
            fi
          done

          if [ "$DRIFT" -gt 0 ]; then
            echo "::error::$DRIFT Lambda(s) failed to deploy. See #536 for runbook."
            exit 1
          fi
